<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BusLive 모형 노선</title>
<style>
  :root{font:16px/1.45 system-ui,"Malgun Gothic",sans-serif;color:#18283c;background:#eaf0f7;--blue:#155db3;--muted:#536981;--line:#dce6f1}
  *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #da7b17;outline-offset:3px}
  header{background:var(--blue);color:white}.bar,.wrap{max-width:690px;margin:auto}.bar{padding:15px 20px;display:flex;justify-content:space-between;align-items:center}.bar strong{font-size:1.1rem}.bar span{font-size:.84rem}
  .wrap{padding:18px 12px 32px}.routes,.directions{display:flex;gap:8px}.routes{margin-bottom:14px}.routes button,.directions button{border:1px solid var(--line);border-radius:10px;background:white;color:var(--blue);font-weight:700;min-height:42px;flex:1;padding:7px}.routes button[aria-pressed=true],.directions button[aria-pressed=true]{background:var(--blue);color:white;border-color:var(--blue)}
  .panel{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.summary{padding:18px 18px 15px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:2rem;line-height:1;margin:0;color:#153e71}.badge{font-size:.78rem;color:#3a5b81;background:#eaf2fc;border-radius:5px;padding:4px 8px;margin-left:8px;vertical-align:middle;font-weight:650}
  .demo{color:var(--blue);background:#f2f7ff;border:1px solid #b9d1eb;border-radius:9px;padding:6px 10px;min-height:40px}#ends{font-weight:650;margin:12px 0}#status{background:#f0f5fb;padding:10px 12px;margin:12px 0 0;border-radius:8px;color:var(--muted);font-size:.9rem}
  ol{list-style:none;margin:0;padding:0 16px 12px;border-top:1px solid var(--line)}li{position:relative;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:9px;min-height:65px;border-bottom:1px solid var(--line);padding:10px 0}li:last-child{border-bottom:0}li:not(:last-child)::after{content:"";width:2px;background:#589cde;position:absolute;left:12px;top:50%;height:100%}.dot{width:13px;height:13px;border:2px solid #2569aa;background:white;border-radius:50%;justify-self:center;z-index:1}.active .dot{background:#2569aa;box-shadow:0 0 0 4px #dbeaf9}.active .name{color:#144e8b}.name{font-weight:700}.role{display:block;font-size:.76rem;color:var(--muted);font-weight:500}.state{background:#e6f2fe;color:#144e8b;padding:4px 7px;border-radius:6px;font-size:.78rem;font-weight:700}
  @media(max-width:390px){.summary{padding:14px 12px}.directions button{font-size:.83rem}.badge{font-size:.72rem}.demo{font-size:.8rem}}
  .traffic{padding:11px 16px;border-top:1px solid var(--line);font-size:.8rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.traffic strong{margin-right:auto}.legend{display:inline-flex;align-items:center;gap:4px}.legend::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--traffic)}.free{--traffic:#19864c}.slow{--traffic:#bd6805}.jam{--traffic:#c33932}.segment{--line-color:var(--traffic)}li.segment::after{background:var(--line-color);width:3px}.segment-label{display:block;margin-top:5px;color:var(--traffic);font-size:.75rem;font-weight:650}
  .forecast{background:#f4f8fd;border-top:1px solid var(--line);padding:12px 16px 8px}.forecast h2{font-size:.88rem;margin:0 0 6px}.bars{height:42px;display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end}.bars span{height:var(--height);background:var(--traffic);border-radius:3px 3px 0 0}.bars .current-hour{outline:2px solid #172d45;outline-offset:1px}.hours{display:flex;justify-content:space-between;color:var(--muted);font-size:.71rem;margin-top:4px}
  @media(max-width:480px){.bar{padding:11px 13px}.wrap{padding:10px 8px 22px}.routes{margin-bottom:8px}.routes button,.directions button{min-height:38px}.summary{padding:12px}.top h1{font-size:1.7rem}#ends{margin:8px 0;font-size:.9rem}#status{margin-top:8px;padding:7px 9px;font-size:.8rem}.forecast{padding:8px 12px 6px}.traffic{padding:6px 12px}.bars{height:34px}li{min-height:54px;padding:6px 0}.segment-label{margin-top:2px}}
  .map-bus{display:grid;place-items:center;width:23px;height:22px;border:2px solid white;padding:0}.map-bus svg{width:13px;height:13px}
  .wait-label{position:absolute;top:50%;left:calc(100% + 4px);transform:translateY(-50%);padding:2px 5px;border:1px solid #e8c291;border-radius:5px;background:#fff4e1;color:#844204;font-size:.72rem;font-weight:750;line-height:1.25;white-space:nowrap}
  .map-bus.label-left .wait-label{left:auto;right:calc(100% + 4px)}li.waiting-row .name{padding-left:64px}
</style>
<style>
  .stop-track{position:relative}.arrival{display:block;font-size:.8rem;margin-top:3px;color:#9c4608;font-weight:700}
  #bus-marker{position:absolute;z-index:3;left:29px;transform:translate(-50%,-50%);width:23px;height:22px;display:grid;place-items:center;border-radius:6px;background:#144e8b;color:white;border:2px solid white;box-shadow:0 0 0 1px #144e8b;pointer-events:none}
  #bus-marker[hidden]{display:none}#bus-marker svg{width:13px;height:13px}#bus-marker.estimated{background:#fff;color:#144e8b;border-style:dashed;border-color:#144e8b;box-shadow:none}
  .view-controls{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}.view-controls button{border:1px solid #b9d1eb;border-radius:8px;padding:5px 10px;background:white;color:#155db3;font-size:.86rem;min-height:36px}.view-controls button[aria-pressed=true]{background:#155db3;color:white}.view-controls #turn-wait{margin-left:auto}.view-controls #turn-wait:disabled{opacity:.55;cursor:default}
  #map{padding:12px;border-top:1px solid var(--line);background:#f5f9fd}.map-track{position:relative;min-height:176px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.map-rail{position:absolute;top:50%;left:10%;right:10%;height:4px;background:#589cde;transform:translateY(-50%)}.map-stop{position:absolute;width:20%;text-align:center;top:50%;transform:translate(-50%,-50%);color:#153e71}.map-stop i{display:block;margin:auto;width:12px;height:12px;background:white;border:2px solid #2569aa;border-radius:100%}.map-stop b{position:absolute;left:3%;width:94%;top:25px;font-size:.75rem;overflow-wrap:anywhere}.map-stop.above b{top:auto;bottom:25px}.map-bus{position:absolute;top:50%;transform:translate(-50%,-50%);padding:2px 4px;border-radius:5px;background:#144e8b;color:white;white-space:nowrap;font-size:.7rem;font-weight:bold}.map-bus.waiting{background:#a84b07}.map-details{margin:8px 0 0;font-size:.86rem;color:#36577b}
</style>
<header><div class="bar"><strong>BusLive 모형 노선</strong><span id="connection">서버 연결 중</span></div></header>
<main class="wrap">
  <nav class="routes" aria-label="노선 선택"></nav>
  <section class="panel" aria-label="노선 정보">
    <div class="summary">
      <div class="top"><h1><span id="number"></span><span id="label" class="badge"></span></h1><button class="demo" id="demo" aria-pressed="false">운행 미리보기</button></div>
      <p id="ends"></p>
      <div class="directions" aria-label="방면 선택"><button data-direction="out"></button><button data-direction="back"></button></div>
      <div class="view-controls" aria-label="노선 보기 및 회차 제어">
        <button id="list-view" aria-pressed="true">정류장 목록</button>
        <button id="map-view" aria-pressed="false">지도</button>
        <button id="turn-wait" aria-pressed="false" disabled>회차 대기</button>
      </div>
      <p id="status" role="status">노선 정보를 불러오는 중</p>
    </div>
    <section class="forecast" aria-labelledby="forecast-title">
      <h2 id="forecast-title">시간대별 가상 혼잡도</h2>
      <div class="bars" id="bars" role="img" aria-label="시간대별 가상 교통 혼잡도"></div>
      <div class="hours" aria-hidden="true"><span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>23시</span></div>
    </section>
    <section id="map" hidden aria-label="모형 노선 지도">
      <strong>모형 노선도</strong>
      <div class="map-track" id="map-track"></div>
      <p class="map-details" id="map-details"></p>
    </section>
    <div class="traffic" aria-label="가상 교통 범례"><strong>가상 교통</strong><span class="legend free">원활</span><span class="legend slow">서행</span><span class="legend jam">정체</span></div>
    <div class="stop-track">
      <ol id="stops" aria-label="정류장 목록"></ol>
      <span id="bus-marker" hidden aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 3c0-1 1-2 5-2s5 1 5 2v9h-1v2h-2v-2H6v2H4v-2H3V3zm2 0v5h6V3H5zm1 6H5v2h1V9zm5 0h-1v2h1V9z"/></svg><span class="wait-label" hidden>회차 대기</span></span>
    </div>
  </section>
</main>
<script>
let data, route = "", direction = "out", follow = true, online = false, demoSince = null;
let view = "list", demoHoldAt = null, liveHold = false, liveDepartureAge = null;
const byId = id => document.getElementById(id);
const buttons = [...document.querySelectorAll("[data-direction]")];
const demo = byId("demo");
const routesNav = document.querySelector(".routes");
const marker = byId("bus-marker");
const waitButton = byId("turn-wait");
let forecastKey = "";

function renderMap(stops, bus, fraction, holding, nextEta) {
  const order = stops.map((_, i) => direction === "out" ? i : stops.length - 1 - i);
  const track = byId("map-track");
  const rail = document.createElement("div");
  rail.className = "map-rail";
  track.replaceChildren(rail);
  const x = index => 10 + 80 * index / (stops.length - 1);
  order.forEach((stop, i) => {
    const node = document.createElement("div");
    node.className = i % 2 === 0 ? "map-stop above" : "map-stop";
    node.style.left = x(i) + "%";
    const label = document.createElement("b");
    label.textContent = stops[stop];
    node.append(document.createElement("i"), label);
    track.append(node);
  });
  const inDirection = bus && direction === bus.direction;
  byId("map-details").textContent = !bus ? "모형 버스 신호 대기 중" : holding
    ? stops[bus.stop] + " · 회차 대기 중" : inDirection
    ? "다음 " + stops[bus.next] + " · " + nextEta : "반대 방면 운행 중";
  if (inDirection || holding) {
    const icon = document.createElement("span");
    icon.className = holding ? "map-bus waiting" : "map-bus";
    const left = x(order.indexOf(bus.stop) + (holding ? 0 : fraction));
    icon.style.left = left + "%";
    icon.classList.toggle("label-left", left >= 70);
    icon.append(marker.querySelector("svg").cloneNode(true));
    if (holding) {
      const badge = marker.querySelector(".wait-label").cloneNode(true);
      badge.hidden = false;
      icon.append(badge);
    }
    icon.setAttribute("aria-hidden", "true");
    track.append(icon);
  }
}

function arrivalText(seconds) {
  const rounded = Math.max(1, Math.ceil(seconds));
  if (rounded <= 10) return "곧 도착 · 약 " + rounded + "초";
  if (rounded < 60) return "약 " + rounded + "초";
  const minutes = Math.floor(rounded / 60);
  const remainder = rounded % 60;
  return "약 " + minutes + "분" + (remainder >= 5 ? " " + remainder + "초" : "");
}

function renderForecast() {
  const now = new Date().getHours();
  const key = route + direction + now;
  if (key === forecastKey) return;
  forecastKey = key;
  const seed = [...route].reduce((sum, ch) => sum + ch.charCodeAt(0), direction === "out" ? 0 : 1);
  const levels = [];
  const bars = Array.from({length: 24}, (_, hour) => {
    const rush = Math.max(0, 4 - Math.abs(hour - 8), 5 - Math.abs(hour - 18));
    const score = 2 + rush + ((hour * 11 + seed * 7) % 3);
    const bar = document.createElement("span");
    const level = score >= 7 ? "정체" : score >= 5 ? "서행" : "원활";
    bar.className = {정체: "jam", 서행: "slow", 원활: "free"}[level];
    if (hour === now) bar.classList.add("current-hour");
    bar.style.setProperty("--height", (score * 11) + "%");
    bar.title = hour + "시 " + level;
    levels.push(bar.title);
    return bar;
  });
  const chart = byId("bars");
  chart.replaceChildren(...bars);
  chart.setAttribute("aria-label", "가상 교통 예보. " + levels.join(", "));
}

function render() {
  byId("connection").textContent = online ? "로컬 서버 연결" : "서버 연결 끊김";
  if (!data || !route) return;
  const {stops, label} = data.routes[route];
  renderForecast();
  const last = stops.length - 1;
  let bus = online ? data.buses[route] : null;
  let holding = false;
  if (demoSince !== null) {
    const now = Date.now();
    holding = demoHoldAt !== null && now >= demoHoldAt;
    const elapsed = ((holding ? demoHoldAt : now) - demoSince) / 1000;
    const t = Math.floor(elapsed / 5) % (2 * last);
    const stop = t <= last ? t : 2 * last - t;
    bus = {stop, direction: t < last ? "out" : "back", next: stop + (t < last ? 1 : -1),
      sinceStop: elapsed % 5, travelSeconds: 5};
  } else if (bus?.stop === last) {
    holding = liveHold;
    if (liveDepartureAge !== null && bus.sinceStop >= liveDepartureAge) {
      bus = {...bus, sinceStop: bus.sinceStop - liveDepartureAge};
    }
  } else {
    liveHold = false;
    liveDepartureAge = null;
  }
  if (bus && follow) direction = bus.direction;
  for (const button of routesNav.children) button.setAttribute("aria-pressed", button.textContent === route);
  byId("number").textContent = route;
  byId("label").textContent = label;
  byId("ends").textContent = stops[0] + " ↔ " + stops[last];
  buttons[0].textContent = stops[last] + " 방면";
  buttons[1].textContent = stops[0] + " 방면";
  for (const button of buttons) button.setAttribute("aria-pressed", button.dataset.direction === direction);
  demo.textContent = demoSince === null ? "운행 미리보기" : "미리보기 끝내기";
  demo.setAttribute("aria-pressed", demoSince !== null);
  waitButton.disabled = demoSince === null && bus?.stop !== last;
  waitButton.setAttribute("aria-pressed", holding || demoHoldAt !== null);
  waitButton.textContent = holding ? "복귀 출발" : demoHoldAt !== null ? "회차 대기 예약 취소" : "회차 대기";
  const elapsed = bus?.sinceStop ?? 0;
  const travel = bus?.travelSeconds ?? 25;
  const overdue = bus && !holding && elapsed >= travel;
  const busInDirection = bus && bus.direction === direction;
  const fraction = holding || elapsed < 1 ? 0 : Math.min(elapsed / travel, 0.9);
  const nextEta = overdue ? "통과 확인 대기" : arrivalText(travel - elapsed);
  const status = bus ? (demoSince !== null ? "미리보기" : "모형 버스") + " · 마지막 위치 " + stops[bus.stop] +
      " · 다음 " + stops[bus.next] : "모형 버스 신호 대기 중";
  const hint = !bus ? "" : holding ? " · 회차 대기 중" : !busInDirection ? " · 반대 방면 운행 중" : overdue ? " · 다음 정류장 통과 확인 대기"
      : elapsed < 1 ? " · 정류장 위치 확인" : " · 구간 위치 및 도착 시각 추정";
  if (byId("status").textContent !== status + hint) byId("status").textContent = status + hint;
  const rows = stops.map((name, i) => {
    const li = document.createElement("li");
    const current = bus?.stop === i;
    const next = bus?.direction === direction && bus.next === i;
    if (current) li.classList.add("active");
    if (current && holding) li.classList.add("waiting-row");
    const role = i === 0 ? "출발지" : i === last ? "회차지" : "";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.setAttribute("aria-hidden", "true");
    const title = document.createElement("div");
    title.className = "name";
    title.textContent = name;
    if (role) {
      const caption = document.createElement("span");
      caption.className = "role";
      caption.textContent = role;
      title.append(caption);
    }
    const segment = direction === "out" ? i : i - 1;
    const traffic = data.traffic?.[route]?.[segment];
    if (traffic) {
      li.classList.add("segment", {원활: "free", 서행: "slow", 정체: "jam"}[traffic]);
      const caption = document.createElement("span");
      caption.className = "segment-label";
      caption.textContent = "다음 구간 " + traffic;
      title.append(caption);
    }
    const stopsAway = busInDirection ? (i - bus.stop) * (direction === "out" ? 1 : -1) : 0;
    if (stopsAway > 0) {
      const eta = document.createElement("span");
      eta.className = "arrival";
      eta.textContent = (holding ? "회차 대기 중" : overdue ? "통과 확인 대기" : arrivalText(stopsAway * travel - elapsed)) +
        " (" + stopsAway + "정류장 전)";
      title.append(eta);
    }
    li.append(dot, title);
    if ((current && !holding) || next) {
      const badge = document.createElement("span");
      badge.className = "state";
      badge.textContent = current ? "마지막 위치" : "다음 정류장";
      li.append(badge);
    }
    return li;
  });
  if (direction === "back") rows.reverse();
  byId("stops").replaceChildren(...rows);
  marker.hidden = !busInDirection && !holding;
  marker.querySelector(".wait-label").hidden = !holding;
  if (busInDirection || holding) {
    const row = direction === "out" ? bus.stop : last - bus.stop;
    const track = byId("stops").parentElement.getBoundingClientRect();
    const from = rows[row].firstElementChild.getBoundingClientRect();
    const to = rows[row + 1]?.firstElementChild.getBoundingClientRect() ?? from;
    marker.style.top = (from.top + from.height / 2 - track.top + (to.top - from.top) * fraction) + "px";
    marker.classList.toggle("estimated", fraction > 0);
  }
  if (view === "map") renderMap(stops, bus, fraction, holding, nextEta);
}

for (const name of ["list", "map"]) byId(name + "-view").onclick = () => {
  view = name;
  byId("list-view").setAttribute("aria-pressed", name === "list");
  byId("map-view").setAttribute("aria-pressed", name === "map");
  byId("map").hidden = name !== "map";
  render();
};

waitButton.onclick = () => {
  if (demoSince !== null) {
    const now = Date.now();
    if (demoHoldAt !== null) {
      if (now >= demoHoldAt) demoSince += now - demoHoldAt;
      demoHoldAt = null;
    } else {
      const oneWay = (data.routes[route].stops.length - 1) * 5000;
      const round = oneWay * 2;
      const elapsed = now - demoSince;
      const turn = demoSince + Math.floor(elapsed / round) * round + oneWay;
      demoHoldAt = now < turn + 5000 ? turn : turn + round;
    }
  } else {
    liveHold = !liveHold;
    liveDepartureAge = liveHold ? null : data.buses[route].sinceStop;
  }
  follow = true;
  render();
};

for (const button of buttons) button.onclick = () => {
  direction = button.dataset.direction;
  follow = false;
  render();
};
demo.onclick = () => {
  if (!data) return;
  demoSince = demoSince === null ? Date.now() : null;
  demoHoldAt = null;
  follow = true;
  render();
};

async function refresh() {
  try {
    const res = await fetch("/api/state", {signal: AbortSignal.timeout(2500)});
    if (!res.ok) throw Error();
    data = await res.json();
    online = true;
    if (!route) {
      const numbers = Object.keys(data.routes);
      const ordered = ["51", "6719", "220", "G1124"].filter(n => numbers.includes(n));
      route = ordered[0];
      for (const n of ordered) {
        const b = document.createElement("button");
        b.textContent = n;
        b.onclick = () => {
          if (route === n) return;
          route = n;
          direction = "out";
          follow = true;
          demoHoldAt = null;
          liveHold = false;
          liveDepartureAge = null;
          if (demoSince !== null) demoSince = Date.now();
          render();
        };
        routesNav.append(b);
      }
    }
  } catch {
    online = false;
  }
  render();
  setTimeout(refresh, 1000);
}
refresh();
setInterval(() => { if (demoSince !== null) render(); }, 1000);
window.addEventListener("resize", render);
</script>
</html>
